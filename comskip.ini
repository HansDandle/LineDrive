; LineDrive's default Comskip settings, for US/Canadian over-the-air broadcasts.
; Use your own instead with recording.comskip_ini in config.json.
; Reference: https://www.kaashoek.com/comskip/ (every option is listed in comskip.ini there)

[Main Settings]
; black frames + logo + scene changes + silence
detect_method=111
verbose=0
max_brightness=60
test_brightness=40
max_avg_brightness=25
maxbright=1
max_volume=500
non_uniformity=500
min_silence=12
punish_threshold=1.3
punish_no_logo=1
validate_silence=1
validate_uniform=1
validate_scenechange=1

; a break is 15 s to 6 min; a stretch of show is at least 2 min
max_commercialbreak=360
min_commercialbreak=15
max_commercial_size=125
min_commercial_size=4
min_show_segment_length=120

[Output Control]
output_default=0
output_edl=1
output_txt=0
output_chapters=0
output_ffmeta=0
delete_logo_file=1
